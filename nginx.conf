server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }

    # ai-server isn't wired into docker-compose.yml yet (no Dockerfile,
    # no compose service) — this route is ready for when it is, mirroring
    # /api/ above. Hostname "ai-server" must match that future service name.
    location /ai/ {
        proxy_pass http://ai-server:8100/;
    }
}
