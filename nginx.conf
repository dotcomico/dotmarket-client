server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }

    location /ai/ {
        proxy_pass http://ai-server:8100/;
        # Tool-calling turns can involve multiple LLM round trips against a
        # local Ollama model; the 60s default read timeout cuts those off
        # with a 504 before ai-server finishes.
        proxy_read_timeout 180s;
    }
}
